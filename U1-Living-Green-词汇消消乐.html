<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>U1-Living Green词汇消消乐</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1e5f8e 0%, #0f3b4f 100%);
            font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(255,248,225,0.96);
            border-radius: 48px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.25);
            padding: 1rem 1.5rem 1.2rem 1.5rem;
        }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ffb74d;
            padding-bottom: 12px;
        }

        .info-panel {
            display: flex;
            gap: 25px;
            background: #fdf8ed;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            box-shadow: inset 0 1px 2px #0001, 0 4px 10px rgba(0,0,0,0.05);
        }

        .timer-box, .score-box {
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timer-box span:first-child, .score-box span:first-child {
            font-size: 1rem;
            font-weight: 600;
            background: #ffd966;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            color: #2d3748;
        }

        .timer-display, .score-display {
            font-family: 'Courier New', monospace;
            background: #1e2a2e;
            color: #f0f9ff;
            padding: 0.1rem 0.6rem;
            border-radius: 40px;
            font-size: 1.4rem;
            font-weight: bold;
            min-width: 90px;
            text-align: center;
        }

        .reset-btn {
            background: #ff9800;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            color: #2c1e0f;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 2px 0 #b45f06;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b45f06;
        }

        .game-board {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
        }

        .column {
            flex: 1;
            min-width: 320px;
            background: #fff6ea;
            border-radius: 32px;
            padding: 0.8rem 1rem;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
        }

        .column h2 {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 0.9rem 0;
            background: #ffd93d;
            display: inline-block;
            width: 100%;
            padding: 0.3rem 0;
            border-radius: 48px;
            color: #2d3e2b;
            letter-spacing: 1px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.85rem;
        }

        .word-card {
            background: #ffffff;
            padding: 0.9rem 0.4rem;
            border-radius: 28px;
            font-size: 1.15rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.12s ease;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            border: 2px solid #ffc857;
            color: #1f3b3c;
            word-break: break-word;
            line-height: 1.3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .word-card.selected {
            background: #ffe0a3;
            border: 3px solid #f57c00;
            color: #b45f06;
            transform: scale(1.01);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .word-card.matched {
            background: #c9bc9f;
            border: 2px solid #8b7a66;
            color: #4a3e2c;
            text-decoration: line-through;
            text-decoration-thickness: 2px;
            cursor: default;
            opacity: 0.65;
            filter: grayscale(0.1);
            transform: none;
            box-shadow: none;
        }

        .word-card.matched:hover {
            transform: none;
            background: #c9bc9f;
        }

        .word-card:hover:not(.matched) {
            background: #ffe2b5;
            transform: translateY(-3px);
            border-color: #ff9f2e;
        }

        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #d32f2f;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 60px;
            z-index: 999;
            box-shadow: 0 5px 15px black;
            animation: fadeOutUp 1.2s forwards;
            pointer-events: none;
            white-space: nowrap;
            font-family: monospace;
        }

        @keyframes fadeOutUp {
            0% { opacity: 1; transform: translateX(-50%) translateY(0);}
            70% { opacity: 0.9; transform: translateX(-50%) translateY(-15px);}
            100% { opacity: 0; transform: translateX(-50%) translateY(-30px); visibility: hidden;}
        }

        .victory-message {
            text-align: center;
            background: gold;
            margin-top: 18px;
            padding: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 60px;
            color: #1e3c2c;
            animation: pulse 0.3s;
        }

        @keyframes pulse {
            0% { transform: scale(0.98);}
            100% { transform: scale(1);}
        }

        footer {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 1rem;
            color: #5c4b2e;
            font-weight: 500;
        }

        @media (max-width: 850px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.7rem;
            }
            .word-card {
                font-size: 1rem;
                padding: 0.7rem 0.3rem;
                min-height: 70px;
            }
            .column h2 {
                font-size: 1.4rem;
            }
        }

        @media (max-height: 750px) {
            .word-card {
                padding: 0.5rem 0.3rem;
                min-height: 65px;
                font-size: 1rem;
            }
            .cards-grid {
                gap: 0.6rem;
            }
            .game-header {
                margin-bottom: 12px;
            }
            footer {
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameApp">
    <div class="game-header">
        <div class="info-panel">
            <div class="timer-box">
                <span>⏱️ 计时</span>
                <span class="timer-display" id="timerDisplay">0.0 s</span>
            </div>
            <div class="score-box">
                <span>🎯 配对</span>
                <span class="score-display" id="scoreDisplay">0 / 33</span>
            </div>
        </div>
        <button class="reset-btn" id="resetGameBtn">🔄 新的一局</button>
    </div>

    <div class="game-board">
        <div class="column">
            <h2>🇬🇧 ENGLISH</h2>
            <div id="englishGrid" class="cards-grid"></div>
        </div>
        <div class="column">
            <h2>🇨🇳 中文释义</h2>
            <div id="chineseGrid" class="cards-grid"></div>
        </div>
    </div>
    <footer>✧ 点击英文单词 → 点击中文释义 (顺序可互换) | 正确配对即消除 ✧</footer>
</div>

<script>
    // ---------- 全新词库 (共33组) ----------
    const PAIRS_RAW = [
{eng:"property",chi:"财产；性质"},
{eng:"self-sufficient",chi:"自给自足的"},
{eng:"accomplish",chi:"完成；实现"},
{eng:"agent",chi:"代理人"},
{eng:"inquire",chi:"询问"},
{eng:"available",chi:"可获得的"},
{eng:"whatsoever",chi:"丝毫（用于强调）"},
{eng:"utility",chi:"公共设施；实用"},
{eng:"haul",chi:"拖；运送"},
{eng:"locate",chi:"找到；定位"},
{eng:"setback",chi:"挫折"},
{eng:"system",chi:"系统"},
{eng:"generate",chi:"产生"},
{eng:"adjustment",chi:"调整"},
{eng:"laundry",chi:"洗衣物"},
{eng:"diligent",chi:"勤奋的"},
{eng:"trash",chi:"垃圾"},
{eng:"recycle",chi:"回收利用"},
{eng:"organic",chi:"有机的"},
{eng:"toss",chi:"扔"},
{eng:"overall",chi:"总体而言"},
{eng:"appreciate",chi:"感激；欣赏"},
{eng:"slow down",chi:"放慢"},
{eng:"set about",chi:"着手"},
{eng:"learn of",chi:"得知"},
{eng:"put in",chi:"投入；安装"},
{eng:"go out",chi:"外出；熄灭"},
{eng:"be familiar with",chi:"熟悉"},
{eng:"ins and outs",chi:"来龙去脉"},
{eng:"consist of",chi:"由……组成"},
{eng:"take sth./sb. for granted",chi:"认为……理所当然"},
{eng:"in use",chi:"在使用中"},
{eng:"in addition",chi:"此外"}
]

    const TOTAL_PAIRS = PAIRS_RAW.length;  // = 11

    let engCards = [];
    let chiCards = [];
    let matchedCount = 0;
    let gameActive = true;
    let gameCompletedFlag = false;

    let selected = {
        type: null,
        index: -1,
        id: null
    };

    let timerSeconds = 0;
    let timerInterval = null;

    const engGrid = document.getElementById("englishGrid");
    const chiGrid = document.getElementById("chineseGrid");
    const timerDisplaySpan = document.getElementById("timerDisplay");
    const scoreDisplaySpan = document.getElementById("scoreDisplay");
    const resetBtn = document.getElementById("resetGameBtn");

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initGameData() {
        let rawEng = PAIRS_RAW.map((item, idx) => ({
            id: idx,
            text: item.eng,
            matched: false
        }));
        let rawChi = PAIRS_RAW.map((item, idx) => ({
            id: idx,
            text: item.chi,
            matched: false
        }));
        engCards = shuffleArray([...rawEng]);
        chiCards = shuffleArray([...rawChi]);
        matchedCount = 0;
        gameCompletedFlag = false;
        gameActive = true;
        clearSelected();
    }

    function clearSelected() {
        selected.type = null;
        selected.index = -1;
        selected.id = null;
    }

    function updateScoreUI() {
        scoreDisplaySpan.innerText = `${matchedCount} / ${TOTAL_PAIRS}`;
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startTimer() {
        if (timerInterval) stopTimer();
        timerInterval = setInterval(() => {
            if (!gameActive || gameCompletedFlag) return;
            timerSeconds += 0.1;
            timerDisplaySpan.innerText = timerSeconds.toFixed(1) + " s";
        }, 100);
    }

    function resetTimer() {
        stopTimer();
        timerSeconds = 0;
        timerDisplaySpan.innerText = "0.0 s";
        startTimer();
    }

    function victoryGame() {
        if (matchedCount === TOTAL_PAIRS && !gameCompletedFlag) {
            gameCompletedFlag = true;
            gameActive = false;
            stopTimer();
            const victoryDiv = document.createElement('div');
            victoryDiv.className = 'victory-message';
            victoryDiv.innerText = `🎉 完美通关！ 🎉  用时 ${timerSeconds.toFixed(1)} 秒 🎉`;
            const container = document.querySelector('.game-container');
            const oldMsg = document.querySelector('.victory-message');
            if(oldMsg) oldMsg.remove();
            container.appendChild(victoryDiv);
            setTimeout(() => {
                if(victoryDiv && victoryDiv.parentNode) victoryDiv.remove();
            }, 4000);
        }
    }

    let toastTimeout = null;
    function showToastMessage(msg) {
        const existingToast = document.querySelector('.toast-msg');
        if(existingToast) existingToast.remove();
        if(toastTimeout) clearTimeout(toastTimeout);
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerText = msg;
        document.body.appendChild(toast);
        toastTimeout = setTimeout(() => {
            if(toast && toast.remove) toast.remove();
        }, 1200);
    }

    function attemptMatch(clickType, clickIdx, clickCard) {
        if (!gameActive || gameCompletedFlag) {
            if(gameCompletedFlag) showToastMessage("🏆 游戏已胜利，请按「新的一局」继续挑战");
            return false;
        }
        if (clickCard.matched) {
            showToastMessage("🔒 单词已消除");
            return false;
        }

        if (selected.type === null) {
            selected.type = clickType;
            selected.index = clickIdx;
            selected.id = clickCard.id;
            renderGame();
            return false;
        }

        if (selected.type === clickType) {
            selected.type = clickType;
            selected.index = clickIdx;
            selected.id = clickCard.id;
            renderGame();
            return false;
        }

        let selectedCard = null;
        if (selected.type === 'eng') {
            selectedCard = engCards[selected.index];
        } else {
            selectedCard = chiCards[selected.index];
        }

        if (selectedCard.matched) {
            clearSelected();
            renderGame();
            showToastMessage("✋ 请重新选择");
            return false;
        }

        const isCorrect = (selectedCard.id === clickCard.id);
        if (isCorrect) {
            let engTargetIdx = -1, chiTargetIdx = -1;
            for (let i = 0; i < engCards.length; i++) {
                if (engCards[i].id === selectedCard.id && !engCards[i].matched) {
                    engTargetIdx = i;
                    break;
                }
            }
            for (let i = 0; i < chiCards.length; i++) {
                if (chiCards[i].id === selectedCard.id && !chiCards[i].matched) {
                    chiTargetIdx = i;
                    break;
                }
            }
            if (engTargetIdx !== -1 && chiTargetIdx !== -1 && !engCards[engTargetIdx].matched && !chiCards[chiTargetIdx].matched) {
                engCards[engTargetIdx].matched = true;
                chiCards[chiTargetIdx].matched = true;
                matchedCount++;
                updateScoreUI();
                clearSelected();
                renderGame();
                if (matchedCount === TOTAL_PAIRS) victoryGame();
                return true;
            } else {
                clearSelected();
                renderGame();
                showToastMessage("⚠️ 配对异常，重新尝试");
                return false;
            }
        } else {
            clearSelected();
            renderGame();
            showToastMessage(`❌ 配对错误！ “${selectedCard.text}” ≠ “${clickCard.text}” ❌`);
            return false;
        }
    }

    function renderGame() {
        engGrid.innerHTML = '';
        chiGrid.innerHTML = '';

        engCards.forEach((card, idx) => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'word-card';
            if (card.matched) cardDiv.classList.add('matched');
            if (selected.type === 'eng' && selected.index === idx && !card.matched) {
                cardDiv.classList.add('selected');
            }
            cardDiv.textContent = card.text;
            cardDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                if (gameCompletedFlag || !gameActive) {
                    if(gameCompletedFlag) showToastMessage("🏆 游戏已胜利，请按「新的一局」");
                    return;
                }
                if (card.matched) {
                    showToastMessage("🔒 已消除");
                    return;
                }
                attemptMatch('eng', idx, card);
            });
            engGrid.appendChild(cardDiv);
        });

        chiCards.forEach((card, idx) => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'word-card';
            if (card.matched) cardDiv.classList.add('matched');
            if (selected.type === 'chi' && selected.index === idx && !card.matched) {
                cardDiv.classList.add('selected');
            }
            cardDiv.textContent = card.text;
            cardDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                if (gameCompletedFlag || !gameActive) {
                    if(gameCompletedFlag) showToastMessage("🏆 游戏胜利，点「新的一局」继续");
                    return;
                }
                if (card.matched) {
                    showToastMessage("🔒 已消除");
                    return;
                }
                attemptMatch('chi', idx, card);
            });
            chiGrid.appendChild(cardDiv);
        });
    }

    function resetGame() {
        stopTimer();
        initGameData();
        updateScoreUI();
        clearSelected();
        const oldVictory = document.querySelector('.victory-message');
        if(oldVictory) oldVictory.remove();
        timerSeconds = 0;
        timerDisplaySpan.innerText = "0.0 s";
        startTimer();
        renderGame();
        gameActive = true;
        gameCompletedFlag = false;
    }

    function initGame() {
        initGameData();
        updateScoreUI();
        clearSelected();
        stopTimer();
        timerSeconds = 0;
        timerDisplaySpan.innerText = "0.0 s";
        startTimer();
        renderGame();
        gameActive = true;
        gameCompletedFlag = false;
    }

    resetBtn.addEventListener('click', () => {
        resetGame();
    });

    initGame();
</script>
</body>
</html>
